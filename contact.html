<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | SafariLink</title>
<style>body{margin:0;font:16px Arial;color:#2c2c2c;background:#f8f7f4;line-height:1.6}header,footer{padding:15px 8%;background:#fff}b{color:#1a5a3a;font-size:20px}.hero{background:linear-gradient(135deg,#1a5a3a,#2d7a52);color:#fff;padding:65px 12%}main{max-width:820px;margin:-30px auto 45px;padding:0 20px}.card{background:#fff;border:1px solid #d4d6cf;border-radius:16px;padding:28px;margin:22px 0;box-shadow:0 4px 12px #0002}h2{color:#1a5a3a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{padding:16px;border:1px solid #d4d6cf;border-radius:9px;background:#f8f7f4}input,textarea{width:100%;padding:10px;margin:5px 0 13px;box-sizing:border-box}button{background:#1a5a3a;color:#fff;border:0;border-radius:7px;padding:11px 18px;font-weight:bold}footer{background:#2c2c2c;color:#ccc;border-top:3px solid #1a5a3a}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style>
</head>
<body>
<header>
<b>▣ SafariLink</b>
</header>
<section class="hero">
<small>CONTACT</small>
<h1>Let’s make tourism operations easier.</h1>
<p>Talk to the SafariLink Tanzania team about the platform, your account or your ideas.</p>
</section>
<main>
<section class="card">
<h2>Contact SafariLink</h2>
<div class="grid">
<div class="item">
<h3>General enquiries</h3>
<a href="mailto:info@safarilink.co.tz">info@safarilink.co.tz</a>
</div>
<div class="item">
<h3>Support</h3>
<a href="mailto:support@safarilink.co.tz">support@safarilink.co.tz</a>
</div>
</div>
</section>
<section class="card">
<h2>Send us a message</h2>
<label>Name</label>
<input placeholder="Full name">
<label>Email</label>
<input placeholder="you@business.com">
<label>Message</label>
<textarea rows="6" placeholder="How can we help?">
</textarea>
<button>Send Message</button>
</section>
</main>
<footer>© 2025 SafariLink Tanzania B2B</footer>
</body>
</html>
